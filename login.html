<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2a3a" />
  <title>云南省·河长制 — 登录</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">
    <div class="page__bg" aria-hidden="true"></div>

    <div class="page__main">
      <section class="brand">
        <h1 class="brand__title">云南省<i>·</i>河长制</h1>
        <p class="brand__sub">管理河湖空间数据，促进水利资源高效利用</p>
      </section>

      <section class="panel">
        <div class="card">
          <div class="card__head">
            <h2 class="card__title">欢迎登陆</h2>
            <a class="card__back" href="./shouce.html" title="返回首页" aria-label="返回首页">
              <svg class="icon" viewBox="0 0 1024 1024" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M947.4 864C893.2 697.7 736.2 578.9 551 575.5c-23.1-0.4-44.9 0.1-65.6 1.5v164.3c0.1 0.5 0.2 1 0.2 1.5 0 4-3.3 7.3-7.3 7.3-2.7 0-5-1.4-6.2-3.5v0.7L68.8 465.4h2.1c-4 0-7.3-3.3-7.3-7.3 0-2.9 1.7-5.4 4.1-6.6L472 169v0.7c1.3-2.1 3.6-3.5 6.2-3.5 4 0 7.3 3.3 7.3 7.3 0 0.5-0.1 1-0.2 1.5v159.4c18.5-0.9 37.9-1.2 58.3-0.8 230.1 3.9 416.7 196.9 416.7 427.1 0.1 35.5-4.5 70.2-12.9 103.3z" />
              </svg>
            </a>
          </div>

          <form class="form" id="login-form" novalidate>
            <div class="field-wrap" data-rule="username">
              <div class="field">
                <span class="field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <circle cx="12" cy="8" r="3.6" />
                    <path d="M4.8 20c0-3.6 3.2-6 7.2-6s7.2 2.4 7.2 6" />
                  </svg>
                </span>
                <input class="field__input" type="text" name="username" placeholder="请输入姓名" autocomplete="username"
                  aria-label="姓名" />
              </div>
              <p class="field__msg"></p>
            </div>

            <div class="field-wrap" data-rule="phone">
              <div class="field">
                <span class="field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <path
                      d="M7.2 4.2c.7-.7 1.8-.6 2.4.2l1.6 2.3c.5.7.4 1.6-.2 2.2l-.7.7c-.3.3-.4.7-.2 1.1.8 1.5 1.9 2.6 3.4 3.4.4.2.8.1 1.1-.2l.7-.7c.6-.6 1.5-.7 2.2-.2l2.3 1.6c.8.6.9 1.7.2 2.4l-1 1c-.8.8-2 1.1-3.1.8-4.1-1.2-7.3-4.4-8.5-8.5-.3-1.1 0-2.3.8-3.1z" />
                  </svg>
                </span>
                <input class="field__input" type="tel" name="phone" inputmode="numeric" maxlength="11"
                  placeholder="请输入电话号码" autocomplete="tel" aria-label="电话号码" />
              </div>
              <p class="field__msg"></p>
            </div>

            <div class="field-wrap" data-rule="smscode">
              <div class="field-row">
                <div class="field">
                  <span class="field__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                      stroke-linejoin="round">
                      <path d="M12 3.2 5 6v5.6c0 4.3 2.9 7.5 7 9.2 4.1-1.7 7-4.9 7-9.2V6z" />
                      <path d="m9.2 11.8 2 2 3.6-3.8" />
                    </svg>
                  </span>
                  <input class="field__input" type="text" name="smscode" inputmode="numeric" maxlength="6"
                    placeholder="请输入验证码" autocomplete="one-time-code" aria-label="短信验证码" />
                </div>
                <button type="button" class="code-btn" data-send-code disabled>获取验证码</button>
              </div>
              <p class="field__msg"></p>
            </div>

            <button type="submit" class="submit">
              <span class="submit__text">登 录</span>
              <span class="submit__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <!-- 登录成功后的管护水系视图 -->
        <div class="card card--result" id="result-card" hidden>
          <div class="result__head">
            <div class="result__titles">
              <h2 class="card__title">我的管护水系</h2>
              <p class="result__meta" id="result-meta"></p>
            </div>
            <button type="button" class="result__exit" id="logout-btn">退出</button>
          </div>

          <div class="result__stats" id="result-stats"></div>

          <div class="result__body" id="result-body" aria-live="polite">
            <p class="result__hint">正在加载管护水系…</p>
          </div>
        </div>
      </section>
    </div>

    <footer class="page__foot">
      <p>主办单位：云南省水利厅</p>
      <p>技术支持：云南省地图院　© All Rights Reserved.</p>
    </footer>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>
  <!-- 脚本地址带版本串，顺序靠 document.write 保证：先是加密库，再是业务脚本 -->
  <script src="assets/vendor/sm2.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
