<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#072F58" />
  <meta name="description" content="云南省河湖长工作手册：政策依据、工作要求、全省河湖长信息、岸线空间管控、清四乱、幸福河湖、高原湖泊与六大水系。">
  <title>云南省河湖长工作手册</title>
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/cover.css" />
</head>

<body>

  <!-- ==================== 封面 ==================== -->
  <div class="cover" id="cover">
    <div class="cv-bg" aria-hidden="true">
      <span class="cv-glow g1"></span>
      <span class="cv-glow g2"></span>
    </div>

    <div class="cv-inner">
      <p class="cv-kicker">欢 迎 使 用</p>
      <h1 class="cv-title">云南省河湖长工作手册</h1>
      <p class="cv-slogan">政策依据·工作清单·河湖信息速查</p>
      <p class="cv-desc">面向省、州（市）、县、乡、村五级河湖长，汇集政策依据、工作要求、全省河湖长信息、岸线空间管控、清四乱、幸福河湖、奖补资金与高原湖泊、六大水系资料，巡河巡湖随手可查。</p>


      <div class="cv-btns">
        <a class="cv-enter" id="coverEnter" href="./shouce.html#ch1">
          <span>进入手册</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13M12.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a class="cv-ghost" href="./云南河湖长制十周年成果云展.html" target="_blank" rel="noopener">参观云展馆</a>
      </div>

      <p class="cv-foot">内部工作资料 ｜ 图件为示意，不作执法依据，引用请与正式文件及主管部门公布数据核对</p>
    </div>
  </div>

  <script src="./js/url-login.js"></script>
  <script>
    /* 进入手册：先播 0.6s 淡出再跳转；脚本失效时 <a href> 仍可直接进。
       带 ?userName&token 时等价于已登录，直达正文、跳过封面 */
    (function () {
      var cover = document.getElementById('cover');
      var btn = document.getElementById('coverEnter');
      var qs = window.location.search || '';

      // 带登录参数 → 直接进正文（登录态已由 url-login.js 写入 localStorage）
      if (/[?&]userName=/i.test(qs) && /[?&]token=/i.test(qs)) {
        window.location.replace('./shouce.html' + qs + '#ch1');
        return;
      }

      if (!cover || !btn) return;
      btn.addEventListener('click', function (e) {
        if (btn.dataset.leaving === '1') return;
        e.preventDefault();
        btn.dataset.leaving = '1';
        cover.classList.add('closing');
        window.setTimeout(function () {
          window.location.href = './shouce.html' + qs + '#ch1';
        }, 600);
      });
    })();
  </script>
</body>

</html>
